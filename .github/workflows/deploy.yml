name: Deploy to VPS

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master # Workflow otomatis berjalan ketika Anda push ke branch 'main'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # Menggunakan server gratis dari GitHub (Linux)

    steps:
      # 1. Mengambil kode dari repositori GitHub Anda
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Menyiapkan Node.js di server GitHub
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Ganti dengan versi Node yang Anda pakai
          cache: 'npm'

      # 3. Proses Build Frontend & Backend di Server GitHub
      - name: Install and Build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY || secrets.CLERK_PUBLISHABLE_KEY || 'pk_live_Y2xlcmsuemVuc3R1ZGlvLm15LmlkJA' }}
          VITE_API_URL: '/api/v1'
        run: |
          npm install
          npm run build
          cd server
          npm install
          npx prisma generate
          npm run build

      # 4. Mengirim hasil Build dari GitHub ke VPS Anda
      - name: Copy files to VPS via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist,server/dist,server/package.json,server/prisma,package.json"
          target: "/var/www/zen-dev"
          rm: false

      # 5. Menjalankan perintah di dalam VPS setelah file terkirim
      - name: Execute SSH Commands on VPS
        uses: appleboy/ssh-action@master
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DATABASE_URL,CLERK_PUBLISHABLE_KEY,CLERK_SECRET_KEY,REPLICATE_API_TOKEN,GEMINI_API_KEY,GITHUB_TOKEN,TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID
          script: |
            mkdir -p /var/www/zen-dev/server
            cd /var/www/zen-dev/server
            
            # Auto-create server/.env if missing
            if [ ! -f .env ]; then
              echo "Creating server/.env file..."
              echo "PORT=5000" > .env
            fi
            
            # Helper to set or update env vars in server/.env (automatically strips accidental quotes)
            set_env() {
              key=$1
              val=$2
              # Strip outer double/single quotes if present
              val=$(echo "$val" | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")
              if [ -n "$val" ]; then
                if grep -q "^${key}=" .env; then
                  sed -i "s|^${key}=.*|${key}=\"${val}\"|" .env
                else
                  echo "${key}=\"${val}\"" >> .env
                fi
              fi
            }

            set_env "DATABASE_URL" "$DATABASE_URL"
            set_env "CLERK_PUBLISHABLE_KEY" "${CLERK_PUBLISHABLE_KEY:-pk_live_Y2xlcmsuemVuc3R1ZGlvLm15LmlkJA}"
            set_env "CLERK_SECRET_KEY" "${CLERK_SECRET_KEY}"
            set_env "REPLICATE_API_TOKEN" "$REPLICATE_API_TOKEN"
            set_env "GEMINI_API_KEY" "$GEMINI_API_KEY"
            set_env "GITHUB_TOKEN" "$GITHUB_TOKEN"
            set_env "TELEGRAM_BOT_TOKEN" "$TELEGRAM_BOT_TOKEN"
            set_env "TELEGRAM_CHAT_ID" "$TELEGRAM_CHAT_ID"

            npm install
            ./node_modules/.bin/prisma generate
            ./node_modules/.bin/prisma db push --accept-data-loss || true
            pm2 restart backend-api || pm2 start dist/index.js --name "backend-api"

      # 6. Update Nginx config to fix robots.txt and sitemap.xml not being served correctly
      - name: Configure Nginx on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Write the Nginx site config for zenstudio.my.id
            sudo tee /etc/nginx/sites-available/zenstudio.my.id > /dev/null << 'NGINX_EOF'
            server {
                listen 80;
                listen [::]:80;
                server_name zenstudio.my.id www.zenstudio.my.id;

                # Redirect HTTP to HTTPS (if SSL is configured)
                return 301 https://$host$request_uri;
            }

            server {
                listen 443 ssl;
                listen [::]:443 ssl;
                server_name zenstudio.my.id www.zenstudio.my.id;

                root /var/www/zen-dev/dist;
                index index.html;

                # ── SEO static files: serve directly, never fall through to SPA ──
                location = /robots.txt {
                    add_header Content-Type text/plain;
                    try_files $uri =404;
                }

                location = /sitemap.xml {
                    add_header Content-Type application/xml;
                    try_files $uri =404;
                }

                # ── API proxy → Express backend ──
                location /api/ {
                    proxy_pass http://localhost:5000;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection 'upgrade';
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_cache_bypass $http_upgrade;
                }

                # ── Static assets with long cache ──
                location /assets/ {
                    expires 1y;
                    add_header Cache-Control "public, immutable";
                    try_files $uri =404;
                }

                # ── SPA fallback: all other routes serve index.html ──
                location / {
                    try_files $uri $uri/ /index.html;
                }
            }
            NGINX_EOF

            # Enable site if not already linked
            sudo ln -sf /etc/nginx/sites-available/zenstudio.my.id /etc/nginx/sites-enabled/zenstudio.my.id

            # Test config and reload Nginx
            sudo nginx -t && sudo systemctl reload nginx
