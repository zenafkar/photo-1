name: Deploy to VPS

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master # Workflow otomatis berjalan ketika Anda push ke branch 'main'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # Menggunakan server gratis dari GitHub (Linux)

    steps:
      # 1. Mengambil kode dari repositori GitHub Anda
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Menyiapkan Node.js di server GitHub
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Ganti dengan versi Node yang Anda pakai
          cache: 'npm'

      # 3. Proses Build Frontend & Backend di Server GitHub
      - name: Install and Build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY || secrets.CLERK_PUBLISHABLE_KEY || 'pk_live_Y2xlcmsuemVuc3R1ZGlvLm15LmlkJA' }}
          VITE_API_URL: '/api/v1'
        run: |
          npm install
          npm run build
          cd server
          npm install
          npx prisma generate
          npm run build

      # 4. Mengirim hasil Build dari GitHub ke VPS Anda
      - name: Copy files to VPS via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist,server/dist,server/package.json,server/prisma,package.json"
          target: "/var/www/zen-dev"
          rm: false

      # 5. Menjalankan perintah di dalam VPS setelah file terkirim
      - name: Execute SSH Commands on VPS
        uses: appleboy/ssh-action@master
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DATABASE_URL,CLERK_PUBLISHABLE_KEY,CLERK_SECRET_KEY,REPLICATE_API_TOKEN,GEMINI_API_KEY,GITHUB_TOKEN,TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID
          script: |
            mkdir -p /var/www/zen-dev/server
            cd /var/www/zen-dev/server
            
            # Auto-create server/.env if missing
            if [ ! -f .env ]; then
              echo "Creating server/.env file..."
              echo "PORT=5000" > .env
            fi
            
            # Helper to set or update env vars in server/.env (automatically strips accidental quotes)
            set_env() {
              key=$1
              val=$2
              # Strip outer double/single quotes if present
              val=$(echo "$val" | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")
              if [ -n "$val" ]; then
                if grep -q "^${key}=" .env; then
                  sed -i "s|^${key}=.*|${key}=\"${val}\"|" .env
                else
                  echo "${key}=\"${val}\"" >> .env
                fi
              fi
            }

            set_env "DATABASE_URL" "$DATABASE_URL"
            set_env "CLERK_PUBLISHABLE_KEY" "${CLERK_PUBLISHABLE_KEY:-pk_live_Y2xlcmsuemVuc3R1ZGlvLm15LmlkJA}"
            set_env "CLERK_SECRET_KEY" "${CLERK_SECRET_KEY}"
            set_env "REPLICATE_API_TOKEN" "$REPLICATE_API_TOKEN"
            set_env "GEMINI_API_KEY" "$GEMINI_API_KEY"
            set_env "GITHUB_TOKEN" "$GITHUB_TOKEN"
            set_env "TELEGRAM_BOT_TOKEN" "$TELEGRAM_BOT_TOKEN"
            set_env "TELEGRAM_CHAT_ID" "$TELEGRAM_CHAT_ID"

            npm install
            ./node_modules/.bin/prisma generate
            ./node_modules/.bin/prisma db push --accept-data-loss || true
            pm2 restart backend-api || pm2 start dist/index.js --name "backend-api"

            # ── Fix SEO: ensure robots.txt & sitemap.xml are served by Nginx ──
            echo "=== SEO Fix: Starting ==="

            # 1. Verify the SEO files exist in dist
            ls -la /var/www/zen-dev/dist/robots.txt /var/www/zen-dev/dist/sitemap.xml 2>&1 || echo "WARNING: SEO files missing in dist!"

            # 2. Find nginx root dir and copy SEO files there (handles root != dist)
            NGINX_ROOT=$(grep -rh 'root ' /etc/nginx/sites-enabled/ 2>/dev/null | grep -v '#' | head -1 | sed 's/.*root *//;s/;.*//' | xargs)
            echo "Nginx root: ${NGINX_ROOT:-not found}"
            if [ -n "$NGINX_ROOT" ] && [ -d "$NGINX_ROOT" ]; then
              sudo cp -f /var/www/zen-dev/dist/robots.txt "$NGINX_ROOT/" 2>/dev/null
              sudo cp -f /var/www/zen-dev/dist/sitemap.xml "$NGINX_ROOT/" 2>/dev/null
              sudo chmod 644 "$NGINX_ROOT/robots.txt" "$NGINX_ROOT/sitemap.xml" 2>/dev/null
              echo "Copied SEO files to $NGINX_ROOT"
              ls -la "$NGINX_ROOT/robots.txt" "$NGINX_ROOT/sitemap.xml" 2>&1
            fi

            # 3. Also fix permissions in dist
            sudo chmod 644 /var/www/zen-dev/dist/robots.txt /var/www/zen-dev/dist/sitemap.xml 2>/dev/null || true

            # 4. Create nginx snippet with simple echo (avoids printf quoting issues)
            sudo mkdir -p /etc/nginx/snippets
            echo 'location = /robots.txt { default_type text/plain; try_files $uri =404; }' | sudo tee /etc/nginx/snippets/seo-files.conf > /dev/null
            echo 'location = /sitemap.xml { default_type application/xml; try_files $uri =404; }' | sudo tee -a /etc/nginx/snippets/seo-files.conf > /dev/null
            echo "Snippet content:"
            cat /etc/nginx/snippets/seo-files.conf

            # 5. Find active nginx config (use -E for extended regex)
            NGINX_CONF=""
            for f in /etc/nginx/sites-enabled/*; do
              if grep -qE "zenstudio|zen-dev" "$f" 2>/dev/null; then
                NGINX_CONF="$f"
                break
              fi
            done
            [ -z "$NGINX_CONF" ] && NGINX_CONF="/etc/nginx/sites-enabled/default"
            echo "Using config: $NGINX_CONF"

            # 6. Remove old SEO includes (prevent duplicates), then add fresh
            sudo sed -i '/seo-files/d' "$NGINX_CONF" 2>/dev/null
            sudo sed -i '/server_name/a\    include /etc/nginx/snippets/seo-files.conf;' "$NGINX_CONF" 2>/dev/null
            echo "Updated nginx config"

            # 7. Test and reload nginx
            sudo nginx -t 2>&1
            sudo systemctl reload nginx 2>&1 && echo "=== Nginx reloaded ===" || echo "WARNING: Nginx reload failed"

