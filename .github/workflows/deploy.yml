name: CI (Test Only)

on:
  workflow_dispatch:
  # push trigger disabled — deployment handled by Telegram deploy bot on VPS
  # Uncomment the lines below to re-enable auto-deploy:
  # push:
  #   branches:
  #     - main
  #     - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install and Build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY || secrets.CLERK_PUBLISHABLE_KEY }}
          VITE_API_URL: '/api/v1'
          # Prisma schema references DIRECT_DATABASE_URL for migrate/direct ops.
          # CI only needs a valid dummy value for `prisma generate`; production
          # backups/migrations use the real value in server/.env (never in CI).
          DIRECT_DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci'
        run: |
          npm install
          npm run build
          cd server
          npm install
          npx prisma generate
          npm run build

      - name: Run Tests (Gate)
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY || secrets.CLERK_PUBLISHABLE_KEY }}
        run: |
          npm test
          cd server && npm test

      - name: Notify Telegram on Test Failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d text="<b>🚫 Tests Failed</b>%0A%0A──────────────────────────%0A<b>Who</b>    ${{ github.actor }}%0A<b>Branch</b>  ${{ github.ref_name }}%0A──────────────────────────%0A%0A<b>Commit</b>%0A${{ github.event.head_commit.message }}%0A%0A<a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'>🔗 View on GitHub</a>"
