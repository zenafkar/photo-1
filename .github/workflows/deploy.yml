name: Deploy to VPS

on:
  push:
    branches:
      - main
      - master # Workflow otomatis berjalan ketika Anda push ke branch 'main'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # Menggunakan server gratis dari GitHub (Linux)

    steps:
      # 1. Mengambil kode dari repositori GitHub Anda
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Menyiapkan Node.js di server GitHub
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Ganti dengan versi Node yang Anda pakai
          cache: 'npm'

      # 3. Proses Build Frontend & Backend di Server GitHub
      - name: Install and Build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY || 'pk_test_YmVjb21pbmcta2FuZ2Fyb28tMzcuY2xlcmsuYWNjb3VudHMuZGV2JA' }}
          VITE_API_URL: ${{ secrets.VITE_API_URL || '/api/v1' }}
        run: |
          npm install
          npm run build
          cd server
          npm install
          npx prisma generate
          npm run build

      # 4. Mengirim hasil Build dari GitHub ke VPS Anda
      - name: Copy files to VPS via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist,server/dist,server/package.json,server/prisma,package.json"
          target: "/var/www/zen-dev"
          rm: false

      # 5. Menjalankan perintah di dalam VPS setelah file terkirim
      - name: Execute SSH Commands on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mkdir -p /var/www/zen-dev/server
            cd /var/www/zen-dev/server
            npm install
            ./node_modules/.bin/prisma generate
            ./node_modules/.bin/prisma db push --accept-data-loss || true
            pm2 restart backend-api || pm2 start dist/index.js --name "backend-api"
